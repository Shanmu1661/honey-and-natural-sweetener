<!DOCTYPE html>
<html lang="en" data-theme="light" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login &amp; Register — Amber &amp; Oak</title>
  
  <meta name="description" content="Sign in to your customer portal or create an account to access member rewards, tracking, and harvest allocations.">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo/logo.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/rtl.css" id="rtl-stylesheet" disabled>
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between">

  <header class="site-navbar border-bottom">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="navbar-brand-logo text-decoration-none">
        <img src="assets/images/logo/logo.svg" alt="Amber &amp; Oak" height="42">
      </a>
      <a href="index.html" class="text-muted small text-decoration-none">
        <i class="fas fa-arrow-left me-1"></i> Back to Store
      </a>
    </div>
  </header>

  <main class="py-5 my-auto">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
          <div class="card border rounded-4 p-4 p-md-5 bg-surface shadow-sm">
            <div class="text-center mb-4">
              <img src="assets/images/logo/logo.svg" alt="Amber &amp; Oak" height="36" class="mb-2">
              <h4 class="font-serif">The Apiary Portal</h4>
              <p class="text-muted small">Sign in to track deliveries and access exclusive batch releases.</p>
            </div>

            <!-- Login / Register Tabs -->
            <ul class="nav nav-pills nav-fill mb-4 p-1 bg-surface-alt rounded-3" id="authTabs" role="tablist">
              <li class="nav-item">
                <button class="nav-link active rounded-3 small fw-bold" data-bs-toggle="pill" data-bs-target="#tab-login">Sign In</button>
              </li>
              <li class="nav-item">
                <button class="nav-link rounded-3 small fw-bold" data-bs-toggle="pill" data-bs-target="#tab-register">New Account</button>
              </li>
            </ul>

            <div class="tab-content">
              <!-- Sign In Form -->
              <div class="tab-pane fade show active" id="tab-login">
                <form onsubmit="event.preventDefault(); FormsHelper.showToast('Signing in...', 'success'); setTimeout(()=>window.location.href='user-dashboard/index.html', 800);">
                  <div class="mb-3">
                    <label class="form-label small fw-bold">Email Address</label>
                    <input type="email" class="form-control" value="eleanor.vance@example.com" required>
                  </div>
                  <div class="mb-3">
                    <div class="d-flex justify-content-between">
                      <label class="form-label small fw-bold">Password</label>
                      <a href="#" class="small text-amber text-decoration-none" onclick="alert('Password reset link sent to your email.');">Forgot?</a>
                    </div>
                    <input type="password" class="form-control" value="••••••••" required>
                  </div>
                  <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                    <label class="form-check-label small" for="rememberMe">Remember this browser</label>
                  </div>
                  <button type="submit" class="btn btn-honey w-100 py-2">Sign In to Account</button>
                </form>

                <div class="mt-4 pt-3 border-top text-center">
                  <div class="small text-muted mb-2">Or quick sign in as:</div>
                  <div class="d-flex justify-content-center gap-2">
                    <a href="user-dashboard/index.html" class="btn btn-sm btn-outline-secondary">Customer Demo</a>
                    <a href="admin-dashboard/index.html" class="btn btn-sm btn-outline-warning">Admin Demo</a>
                  </div>
                </div>
              </div>

              <!-- Register Form -->
              <div class="tab-pane fade" id="tab-register">
                <form onsubmit="event.preventDefault(); FormsHelper.showToast('Account created! Welcome to Amber & Oak.', 'success'); setTimeout(()=>window.location.href='user-dashboard/index.html', 800);">
                  <div class="mb-3">
                    <label class="form-label small fw-bold">Full Name</label>
                    <input type="text" class="form-control" placeholder="e.g. Liam Sterling" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label small fw-bold">Email Address</label>
                    <input type="email" class="form-control" placeholder="liam@example.com" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label small fw-bold">Password</label>
                    <input type="password" class="form-control" placeholder="Create strong password" required>
                  </div>
                  <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="agreeTerms" required checked>
                    <label class="form-check-label small" for="agreeTerms">I agree to Terms of Service &amp; Organic Harvest Guarantee</label>
                  </div>
                  <button type="submit" class="btn btn-honey w-100 py-2">Create Forager Account</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer py-3">
    <div class="container text-center small text-muted">
      &copy; 2026 Amber &amp; Oak Honey Co. All rights reserved.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/rtl.js"></script>
  <script src="js/forms.js"></script>
</body>
</html>
