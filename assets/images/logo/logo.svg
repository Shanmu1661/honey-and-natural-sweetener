<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 225 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D97706" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Honeycomb Hexagon Badge -->
  <g transform="translate(4, 4)" filter="url(#glow)">
    <!-- Hexagon Outer -->
    <polygon points="26,2 50,15 50,43 26,56 2,43 2,15" fill="url(#goldGrad)" />
    <!-- Hexagon Inner -->
    <polygon points="26,6 46,17 46,41 26,52 6,41 6,17" fill="#1C1917" opacity="0.15" />
    <polygon points="26,8 44,18 44,39 26,49 8,39 8,18" fill="#FFFBEB" />
    
    <!-- Bee Icon Symbol Inside -->
    <!-- Wings -->
    <ellipse cx="20" cy="22" rx="6.5" ry="3.5" transform="rotate(-35 20 22)" fill="url(#goldGrad)" opacity="0.75" />
    <ellipse cx="32" cy="22" rx="6.5" ry="3.5" transform="rotate(35 32 22)" fill="url(#goldGrad)" opacity="0.75" />
    
    <!-- Bee Body -->
    <ellipse cx="26" cy="28" rx="6" ry="9" fill="#1E293B" />
    <!-- Golden Stripes -->
    <path d="M21 26 Q26 28 31 26" stroke="#F59E0B" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M21.5 30 Q26 32 30.5 30" stroke="#F59E0B" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <!-- Bee Head -->
    <circle cx="26" cy="18" r="3.2" fill="#1E293B" />
    <!-- Stinger -->
    <polygon points="25.2,37 26.8,37 26,39.5" fill="#1E293B" />
    
    <!-- Little droplet -->
    <path d="M26 42 C24.5 44 23 45 23 46.5 C23 48.2 24.3 49.5 26 49.5 C27.7 49.5 29 48.2 29 46.5 C29 45 27.5 44 26 42 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(64, 14)">
    <!-- Primary Name -->
    <text x="0" y="22" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="800" letter-spacing="0.5" fill="#1C1917">
      AMBER<tspan fill="#D97706">&amp;</tspan>OAK
    </text>
    <!-- Tagline -->
    <text x="1" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8" font-weight="700" letter-spacing="1.2" fill="#B45309">
      RAW HONEY &amp; NATURAL SWEETENERS
    </text>
  </g>
</svg>
