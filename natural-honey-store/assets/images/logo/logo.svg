<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 48" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#D97706" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Honeycomb Hexagon Badge -->
  <g transform="translate(2, 2)" filter="url(#glow)">
    <!-- Hexagon Outer -->
    <polygon points="19,1 37,11.5 37,32.5 19,43 1,32.5 1,11.5" fill="url(#goldGrad)" />
    <!-- Hexagon Inner -->
    <polygon points="19,4 34,12.5 34,31.5 19,40 4,31.5 4,12.5" fill="#1C1917" opacity="0.15" />
    <polygon points="19,5.5 32.5,13.5 32.5,30.5 19,38.5 5.5,30.5 5.5,13.5" fill="#FFFBEB" />
    
    <!-- Bee Icon Symbol Inside -->
    <!-- Wings -->
    <ellipse cx="14.5" cy="18" rx="5" ry="2.8" transform="rotate(-35 14.5 18)" fill="url(#goldGrad)" opacity="0.8" />
    <ellipse cx="23.5" cy="18" rx="5" ry="2.8" transform="rotate(35 23.5 18)" fill="url(#goldGrad)" opacity="0.8" />
    
    <!-- Bee Body -->
    <ellipse cx="19" cy="22.5" rx="4.8" ry="7" fill="#1E293B" />
    <!-- Golden Stripes -->
    <path d="M15 21 Q19 22.5 23 21" stroke="#F59E0B" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M15.5 24 Q19 25.5 22.5 24" stroke="#F59E0B" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <!-- Bee Head -->
    <circle cx="19" cy="14.5" r="2.5" fill="#1E293B" />
    <!-- Stinger -->
    <polygon points="18.3,29.5 19.7,29.5 19,31.5" fill="#1E293B" />
    
    <!-- Little droplet -->
    <path d="M19 33.5 C17.8 35 16.6 36 16.6 37.2 C16.6 38.5 17.7 39.5 19 39.5 C20.3 39.5 21.4 38.5 21.4 37.2 C21.4 36 20.2 35 19 33.5 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(46, 0)">
    <!-- Primary Name -->
    <text x="0" y="24" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="21" font-weight="800" letter-spacing="0.5" fill="#1C1917">
      AMBER <tspan fill="#D97706">&amp;</tspan> OAK
    </text>
    <!-- Tagline -->
    <text x="0.5" y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" letter-spacing="1.0" fill="#B45309">
      RAW HONEY &amp; NATURAL SWEETENERS
    </text>
  </g>
</svg>
